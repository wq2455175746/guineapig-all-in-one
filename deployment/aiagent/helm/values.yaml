# Default values for guineapig-aiagent.

environment:
  type: "dev"

configmap:
  enabled: false

rbac:
  enabled: false

secret:
  enabled: false

securityContext:
  enabled: false

deployment:
  name: guineapig-aiagent
  replicaCount: 1
  app: guineapig-aiagent
  initContainer:
    enabled: false
  container:
    name: guineapig-aiagent
    image: ""
    ports:
    - name: http
      containerPort: 8000
      protocol: TCP
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 2Gi
    restartPolicy: Always
    terminationGracePeriodSeconds: 120
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "sleep 8"]
    dnsPolicy: ClusterFirst
    imagePullPolicy: IfNotPresent
  strategy:
    # 升级时先拉起新 Pod、容量不降，逐 Pod 替换，限制单次断连波及面
    maxUnavailable: 0
    maxSurge: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

podDisruptionBudget:
  enabled: false
  minAvailable: 1

affinity: {}
nodeSelector: {}
tolerations: []

persistence: {}

service:
  name: guineapig-aiagent
  type: ClusterIP
  # ClientIP 亲和：同一 backend Pod 的 SSE 流与控制 POST 同源 IP，钉到同一 aiagent Pod，
  # 保证内存态 AgentEventManager._sessions 命中，从而支持 aiagent 多副本
  sessionAffinity: ClientIP

ingress:
  enabled: false
