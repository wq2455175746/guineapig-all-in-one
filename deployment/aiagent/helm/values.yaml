# Default values for guineapig-aiagent.

environment:
  type: "dev"

configmap:
  enabled: false

rbac:
  enabled: false

secret:
  enabled: false

securityContext:
  enabled: false

deployment:
  name: guineapig-aiagent
  replicaCount: 1
  app: guineapig-aiagent
  initContainer:
    enabled: false
  container:
    name: guineapig-aiagent
    image: ""
    ports:
    - name: http
      containerPort: 8000
      protocol: TCP
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 2Gi
    restartPolicy: Always
    terminationGracePeriodSeconds: 30
    dnsPolicy: ClusterFirst
    imagePullPolicy: IfNotPresent
  strategy:
    maxUnavailable: 25%
    maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

affinity: {}
nodeSelector: {}
tolerations: []

persistence: {}

service:
  name: guineapig-aiagent
  type: ClusterIP
  sessionAffinity: None

ingress:
  enabled: false
