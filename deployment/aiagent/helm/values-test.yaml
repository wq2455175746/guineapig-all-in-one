environment:
  type: "test"

configmap:
  enabled: false

rbac:
  enabled: false

secret:
  enabled: true
  name: &secretName "guineapig-aiagent-secret"
  data:
    LLM_API_KEY: xxx
    LLM_BASE_URL: https://api.deepseek.com/v1
    LLM_MODEL_NAME: deepseek-chat
    OSS_AK: xxx
    OSS_SK: xxx
    OSS_ENDPOINT: http://minio-service:9000
    OSS_BUCKET: guineapig
    REDIS_HOST: redis-service
    REDIS_PORT: "6379"
    REDIS_PASSWORD: xxx
    SECRET_KEY: your-secret-key-change-in-production
    BACKEND_BASE_URL: http://guineapig-backend:6880
    SEARXNG_URL: http://searxng:8484
    ASR_API_URL: http://asr-service:9991/v1/audio/transcriptions
    TTS_API_URL: http://tts-service:9992/inference_zero_shot

deployment:
  name: &deploymentName "guineapig-aiagent"
  replicaCount: 2
  app: "guineapig-aiagent"
  initContainer:
    enabled: false
  container:
    name: *deploymentName
    image: harbor.whg11.local:17020/aiagent/guineapig-aiagent:1.0.0
    envFrom:
    - secretRef:
        name: *secretName
    env:
      - name: TZ
        value: Asia/Shanghai
      - name: ENV
        value: test
      - name: DEBUG
        value: "false"
      - name: DOCS_ENABLED
        value: "false"
      - name: PROJ_LOG_LEVEL
        value: INFO
      - name: K8S_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: K8S_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: K8S_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: K8S_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
    ports:
    - name: http
      containerPort: 8000
      protocol: TCP
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: "2"
        memory: 4Gi
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 15
    startupProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 30
    restartPolicy: Always
    terminationGracePeriodSeconds: 30
    dnsPolicy: ClusterFirst
    imagePullPolicy: IfNotPresent
  imagePullSecrets: docker-login
  strategy:
    maxUnavailable: 25%
    maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

affinity: {}
nodeSelector: {}
tolerations: []

persistence:
  data:
    enabled: true
    type: pvc
    volumeMounts:
      - mountPath: /app/data
        subPath: aiagent-data
    pvc:
      size: "20Gi"
      accessMode: "ReadWriteOnce"
      storageClass: "nfs-storage-class"

service:
  name: *deploymentName
  type: ClusterIP
  sessionAffinity: None

ingress:
  enabled: false
