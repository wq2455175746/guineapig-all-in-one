{{- if .Values.secret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.secret.name }}
type: Opaque
data:
  {{- range $key, $val := .Values.secret.data }}
  {{- if ne (toString $val) "" }}
  {{ $key }}: {{ $val | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end -}}
