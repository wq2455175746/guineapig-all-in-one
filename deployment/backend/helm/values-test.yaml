environment:
  type: "test"

configmap:
  enabled: true
  name: &configmapName guineapig-backend-cm
  files:
    config.yaml:
      port: 6880
      version: "1.0"
      debug: false
      jwtSecret: ${JWT_SECRET}
      database:
        autoMigrate: false
        driver: mysql
        source: "${MYSQL_USERNAME}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST})/guineapig?parseTime=true&charset=utf8mb4&loc=Local"
      rsa:
        privateKey: /app/private.key
      redis:
        addr: ${REDIS_HOST}
        password: ${REDIS_PASSWORD}
        db: 0
      admin:
        token: ${ADMIN_TOKEN}
      aiAgent:
        baseUrl: ${AIAGENT_BASE_URL}
      s3:
        bucket: ${S3_BUCKET}
        region: ${S3_REGION}
        endpoint: ${S3_ENDPOINT}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
        presignExpiryMinute: 15
        forcePathStyle: true
      rateLimiter:
        botQps: 5

rbac:
  enabled: false

secret:
  enabled: true
  name: &secretName "guineapig-backend-secret"
  data:
    MYSQL_USERNAME: root
    MYSQL_PASSWORD: xxx
    MYSQL_HOST: mysql-service:3306
    REDIS_HOST: redis-service:6379
    REDIS_PASSWORD: xxx
    JWT_SECRET: xxx
    ADMIN_TOKEN: xxx
    S3_BUCKET: guineapig
    S3_REGION: us-east-1
    S3_ENDPOINT: http://minio-service:9000
    S3_ACCESS_KEY: xxx
    S3_SECRET_KEY: xxx
    AIAGENT_BASE_URL: http://guineapig-aiagent:8000

deployment:
  name: &deploymentName "guineapig-backend"
  replicaCount: 2
  app: "guineapig-backend"
  initContainer:
    enabled: false
  container:
    name: *deploymentName
    image: harbor.whg11.local:17020/aiagent/guineapig:1.0.0
    envFrom:
    - secretRef:
        name: *secretName
    env:
      - name: TZ
        value: Asia/Shanghai
      - name: K8S_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: K8S_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: K8S_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: K8S_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
    ports:
    - name: http
      containerPort: 6880
      protocol: TCP
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: "1"
        memory: 1Gi
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 15
    startupProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 30
    restartPolicy: Always
    terminationGracePeriodSeconds: 30
    dnsPolicy: ClusterFirst
    imagePullPolicy: IfNotPresent
  imagePullSecrets: docker-login
  strategy:
    maxUnavailable: 25%
    maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

affinity: {}
nodeSelector: {}
tolerations: []

persistence:
  config:
    enabled: true
    type: configMap
    configMap:
      name: *configmapName
      items:
        - key: config.yaml
          path: config.yaml
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true

service:
  name: *deploymentName
  type: ClusterIP
  sessionAffinity: None
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "6880"
    prometheus.io/path: "/api/v1/health"

ingress:
  enabled: false
