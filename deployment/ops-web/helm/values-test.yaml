environment:
  type: "test"

configmap:
  enabled: true
  name: &configmapName guineapig-ops-web-cm
  files:
    nginx.conf: |
      server {
          listen 80;
          server_name _;

          root /usr/share/nginx/html;
          index index.html;

          gzip on;
          gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
          gzip_min_length 1024;
          gzip_vary on;

          location /assets/ {
              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location / {
              try_files $uri $uri/ /index.html;
          }

          location /admin/api/v1/ {
              proxy_pass http://guineapig-backend:6880/admin/api/v1/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
          }

          location /api/v1/ {
              proxy_pass http://guineapig-backend:6880/api/v1/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
          }

          location /admin/api/v1/ws/ {
              proxy_pass http://guineapig-backend:6880/admin/api/v1/ws/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_read_timeout 3600s;
          }

          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-XSS-Protection "1; mode=block" always;
      }

rbac:
  enabled: false

secret:
  enabled: false

deployment:
  name: &deploymentName "guineapig-ops-web"
  replicaCount: 2
  app: "guineapig-ops-web"
  initContainer:
    enabled: false
  container:
    name: *deploymentName
    image: harbor.whg11.local:17020/aiagent/guineapig-web:1.0.0
    ports:
    - name: http
      containerPort: 80
      protocol: TCP
    resources:
      limits:
        cpu: "0.5"
        memory: 512Mi
      requests:
        cpu: "0.2"
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 15
    restartPolicy: Always
    terminationGracePeriodSeconds: 30
    dnsPolicy: ClusterFirst
    imagePullPolicy: IfNotPresent
  imagePullSecrets: docker-login
  strategy:
    maxUnavailable: 25%
    maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

affinity: {}
nodeSelector: {}
tolerations: []

persistence:
  nginx-conf:
    enabled: true
    type: configMap
    configMap:
      name: *configmapName
      items:
        - key: nginx.conf
          path: nginx.conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true

service:
  name: *deploymentName
  type: ClusterIP
  sessionAffinity: None

ingress:
  enabled: false
