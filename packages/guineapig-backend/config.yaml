port: 6880
version: 1.0
# debug 由环境变量 DEBUG 控制（默认 false），避免启动时打印含密钥配置
debug: false
jwtSecret: ${JWT_SECRET}
registerCode: ${REGISTER_CODE}
database:
  autoMigrate: false
  driver: mysql
  source: ${MYSQL_USERNAME}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST})/guineapig?parseTime=true&charset=utf8mb4&loc=Local
rsa:
  privateKey: "private.key"
redis:
  addr: ${REDIS_HOST}
#  addr: 127.0.0.1:7000
  password: ${REDIS_PASSWORD}
  db: 0
admin:
  token: ${ADMIN_TOKEN}

# CORS 允许的前端域名白名单（逗号分隔）
corsHosts: "http://guineapig-ops-web.local:5173,http://guineapig-client.local:5174"
# CORS 允许的自定义请求头白名单（逗号分隔），与内置标准头合并
corsHeaders: "X-Device-Id,X-User-Id,X-User-Token,X-Request-Id,X-Admin-Token,X-Inner-Token"

# 内部服务（aiagent 等）回调鉴权
inner:
  token: ${INNER_TOKEN}

aiAgent:
  baseUrl: ${AIAGENT_BASE_URL}

# aimodel/test 连接测试的网络白名单（逗号分隔，形如 api.openai.com,api.deepseek.com）
# 未配置时默认仅允许本机回环地址（localhost/127.0.0.1），其余一律拒绝
aimodel:
  allowedHosts: ${AIMODEL_ALLOWED_HOSTS}

s3:
  bucket: ${S3_BUCKET}
  region: ${S3_REGION}
  endpoint: ${S3_ENDPOINT}
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}
  presignExpiryMinute: 15
  forcePathStyle: true

# 限流配置
# type: memory | redis（默认 redis）
# enableConcurrency: 是否开启接口并发限制（开启后需在 concurrency 下按路由 path 配置上限）
# enableQps: QPS 限流，当前中间件尚未接线，保留字段仅供后续实现
rateLimiter:
  type: redis
  enableConcurrency: false
  concurrency: {}
  enableQps: false
  qps: {}
  botQps: 5
